name: bluegrass
display_name: Bluegrass Music
description: Bluegrass music culture, history, and community

content_source_name: Bluegrass Unlimited
content_source_description: Bluegrass Unlimited Archives

entity_categories:
  - name: instruments
    display_name: Instruments
    patterns:
      mandolin: ["mandolin", "mando"]
      banjo: ["banjo", "5-string", "five-string"]
      fiddle: ["fiddle", "violin", "fiddler", "fiddlin"]
      guitar: ["guitar", "flatpick", "flat-pick", "dreadnought"]
      dobro: ["dobro", "resonator", "resophonic"]
      bass: ["bass", "upright bass", "string bass", "doghouse"]

topic_categories:
  - name: technique
    patterns: ["technique", "style", "picking", "chop", "lick", "run"]
  - name: history
    patterns: ["history", "origin", "began", "started", "founded", "early days"]
  - name: recording
    patterns: ["record", "album", "session", "studio", "track"]
  - name: touring
    patterns: ["tour", "road", "travel", "show", "festival", "concert"]
  - name: personal
    patterns: ["born", "grew up", "childhood", "family", "married", "wife", "husband"]
  - name: gear
    patterns: ["instrument", "strings", "pick", "mic", "amp", "setup"]
  - name: business
    patterns: ["contract", "label", "money", "paid", "booking", "manager"]
  - name: jam
    patterns: ["jam", "picking party", "session", "sitting in"]

tone_indicators:
  - tone: nostalgic
    patterns: ["remember", "those days", "back then", "used to", "old times"]
  - tone: humorous
    patterns: ["funny", "laugh", "joke", "hilarious", "crazy"]
  - tone: technical
    patterns: ["technique", "position", "finger", "fret", "timing"]
  - tone: biographical
    patterns: ["born", "grew up", "childhood", "family"]

tone_guidelines:
  - Be affectionate and celebratory toward bluegrass artists — legends AND current players alike
  - Never pit modern artists against legends or imply current players are lesser
  - Artists like Billy Strings, Molly Tuttle, Sierra Hull, Sturgill Simpson are beloved — treat them with the same respect as Monroe or Scruggs
  - Humor should come from love of the genre, not tearing anyone down
  - It's OK to joke about quirks/personalities, but always with respect
  - Think "laughing with" not "laughing at"
  - Positive > negative energy

style_guidelines:
  - Write in normal internet English
  - Avoid overdoing dialect or apostrophes (don't write "eyein'", "glarin'", "reckon", etc)
  - Keep it natural and readable
  - Ground humor in real facts/stories from the provided context

humor_focus:
  - Artist personalities and quirks
  - Instrument-specific stereotypes
  - Genre debates and gatekeeping
  - Festival culture
  - Jam session dynamics

# Evaluation criteria for two-stage generation
# Each domain can define what matters for scoring memes
# NOTE: Humor is weighted highest - funny beats accurate
evaluation_criteria:
  - name: humor
    display_name: Humor
    description: Is it actually funny? Would people share this?
    weight: 0.50
    scoring_guide:
      low: "Not funny, forced, or confusing"
      medium: "Mildly amusing, decent chuckle"
      high: "Actually hilarious, would go viral, makes you laugh out loud"

  - name: cultural_legitimacy
    display_name: Cultural Legitimacy
    description: Would actual bluegrass fans recognize and appreciate this?
    weight: 0.30
    scoring_guide:
      low: "Generic, could be any genre, fans wouldn't get it"
      medium: "Somewhat bluegrass-specific"
      high: "Deep cut that real fans would love"

  - name: source_accuracy
    display_name: Grounded in Reality
    description: Is it based on real facts/people, OR is it intentionally absurdist?
    weight: 0.20
    low_score_note: "might be intentional absurdism - check humor score"
    scoring_guide:
      low: "Random/confusing with no clear joke - not absurdist, just wrong"
      medium: "Loosely based on reality or clearly absurdist on purpose"
      high: "Accurate reference OR brilliant absurdism that's funny because it's wrong"

current_events:
  enabled: true
  search_queries:
    - "bluegrass music"
    - "bluegrass festival"
    - "IBMA"
  max_results: 10

topic_radar:
  watchlist_sources:
    publications:
      - name: Bluegrass Today
        url: https://bluegrasstoday.com/
        notes: News, releases, tour and festival announcements
      - name: Bluegrass Unlimited
        url: https://bluegrassunlimited.com/
        notes: Archive-grounded history and scene coverage
      - name: IBMA
        url: https://worldofbluegrass.org/
        notes: Awards, World of Bluegrass, industry news
    festivals:
      - name: ROMP Festival
        url: https://rompfest.com/
        notes: Owensboro festival with strong bluegrass identity
      - name: Grey Fox Bluegrass Festival
        url: https://greyfoxbluegrass.com/
        notes: Major festival lineup and camping culture
      - name: Telluride Bluegrass Festival
        url: https://bluegrass.com/telluride
        notes: Crossover prestige, travel, lineup discourse
      - name: MerleFest
        url: https://merlefest.org/
        notes: Roots/bluegrass crossover and discovery lane
    social_lanes:
      - Billy Strings tour and fan reactions
      - Molly Tuttle releases and award moments
      - Sierra Hull musician discourse
      - emerging band festival lineup announcements
      - jam etiquette complaints
      - gear and instrument flexing
  priority_entities:
    - Billy Strings
    - Molly Tuttle
    - Sierra Hull
    - Sturgill Simpson
    - Sam Bush
    - Bela Fleck
    - Alison Krauss
    - Del McCoury
    - Jerry Douglas
    - Tony Rice
    - Bill Monroe
    - Earl Scruggs
  event_terms:
    - festival lineup
    - campground jam
    - late-night picking circle
    - IBMA week
    - artist workshop
    - parking lot jam
    - merch table
    - weather forecast
  rituals:
    - banjo player treating tuning like a hostage negotiation
    - someone calling a jam tune nobody actually knows
    - the quiet guitar player being the most dangerous musician there
    - festival campers forming a government by day three
    - arguing whether a very good song is legally bluegrass
    - buying one more instrument because this one will fix your timing
    - pretending not to care about the lineup while refreshing the page
    - the mandolin chop becoming the group chat's emotional support sound
  seed_topics:
    - topic: Billy Strings fans explaining this is definitely still bluegrass
      lane: anchor_artist
      source: bluegrass radar seed
      why_now: Billy is the biggest mainstream bridge into the scene, so his fan culture is always high-signal.
      meme_angle: Contrast huge crossover energy with tiny traditionalist rule debates.
      audience: Billy Strings fans and bluegrass lifers
      freshness_score: 9
      relevance_score: 10
      comedy_score: 9
      risk_notes: Keep it affectionate; do not frame modern fans as lesser.
    - topic: emerging bluegrass bands trying to survive festival season
      lane: emerging_artist
      source: bluegrass radar seed
      why_now: Festival lineups constantly create new discovery moments for bands.
      meme_angle: Treat touring logistics, merch tables, and late-night jams as heroic trials.
      audience: touring musicians and festival regulars
      freshness_score: 8
      relevance_score: 9
      comedy_score: 8
    - topic: festival lineup announcement group chat behavior
      lane: festival_event
      source: bluegrass radar seed
      why_now: Lineup drops, ticket windows, and travel planning are recurring social triggers.
      meme_angle: Make the planning spiral more intense than the actual festival.
      audience: festival-goers
      freshness_score: 8
      relevance_score: 9
      comedy_score: 8
    - topic: old school bluegrass fans discovering a viral TikTok clip
      lane: current_culture
      source: bluegrass radar seed
      why_now: Bluegrass keeps colliding with broader short-form internet culture.
      meme_angle: Contrast old scene norms with algorithmic discovery and comment-section chaos.
      audience: fans who live between archive culture and modern feeds
      freshness_score: 8
      relevance_score: 8
      comedy_score: 8

# Flag memes as potential absurdism when source_accuracy < 4 and humor >= 6
absurdism_detection:
  enabled: true
  low_accuracy_threshold: 4
  high_humor_threshold: 6
